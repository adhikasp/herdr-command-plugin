[package]
name = "herdr-command-plugin"
version = "0.16.1"
edition = "2021"
rust-version = "1.88"
description = "Cmd+K for Herdr: fuzzy-find any space, tab, pane, agent or command, with agent icons and automatic tab titles"
license = "MIT"
repository = "https://github.com/adhikasp/herdr-command-plugin"
publish = false

[[bin]]
name = "herdr-command-plugin"
path = "src/main.rs"

[features]
# Only for the README demo recorder (examples/record_demo); never in the binary.
demo = ["dep:ab_glyph"]

[[example]]
name = "record_demo"
path = "examples/record_demo/main.rs"
required-features = ["demo"]

[dependencies]
ab_glyph = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
