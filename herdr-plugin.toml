id = "herdr-command-plugin"
name = "Command"
version = "0.14.0"
# Requires startup hooks and agent session metadata from Herdr 0.9.
min_herdr_version = "0.9.0"
description = "Cmd+K for Herdr: fuzzy-find any space, tab, pane, agent or command, with agent icons and optional automatic tab titles"
platforms = ["linux", "macos", "windows"]

# The plugin is a Rust binary at bin/herdr-command-plugin (bin/herdr-command-plugin.exe on Windows).
# On install (updating is reinstalling), Herdr runs these steps in the plugin
# directory: they download the release binary for this version and platform,
# check it against the release's SHA256SUMS, and fall back to
# `cargo build --release` (Rust 1.88+). Herdr
# resolves a command path with a separator from the plugin directory. On
# Windows the step also leaves an extensionless bin/herdr-command-plugin copy, so the
# shared commands below run there as written.
[[build]]
command = ["sh", "scripts/install.sh"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]
platforms = ["windows"]

# One action for every platform, so one keybinding works everywhere. Herdr
# starts manifest commands without a shell and Windows has no `sh`, so the
# binary opens the popup itself (`--open`). On Windows, install.ps1 puts
# bin\herdr-command-plugin beside bin\herdr-command-plugin.exe, as for the bar pane.
[[actions]]
id = "open"
title = "Open command bar"
description = "Fuzzy-jump to any tab, pane, or agent"
contexts = ["global"]
command = ["bin/herdr-command-plugin", "--open"]

# Kept so that Windows configs from 0.8 and 0.9 that bind it still work.
[[actions]]
id = "open-windows"
title = "Open command bar"
description = "Fuzzy-jump to any tab, pane, or agent"
contexts = ["global"]
platforms = ["windows"]
command = ["bin/herdr-command-plugin.exe", "--open"]

[[panes]]
id = "bar"
title = "Bar"
description = "Fuzzy-jump to any tab, pane, or agent"
placement = "popup"
width = "74%"
height = "62%"
command = ["bin/herdr-command-plugin"]

[[startup]]
command = ["bin/herdr-command-plugin", "--start-titles"]

# Keeps the saved SSH machines' spaces, tabs and agents fresh for the bar.
[[startup]]
command = ["bin/herdr-command-plugin", "--start-machines"]

[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-command-plugin", "--start-titles"]

[[actions]]
id = "start-titles"
title = "Start tab watcher"
description = "Start task title and tab status updates enabled in the plugin config"
contexts = ["global"]
command = ["bin/herdr-command-plugin", "--start-titles", "--resume"]

[[actions]]
id = "stop-titles"
title = "Stop tab watcher"
description = "Stop this server's title and status watcher, restoring bare tab names"
contexts = ["global"]
command = ["bin/herdr-command-plugin", "--stop-titles"]
